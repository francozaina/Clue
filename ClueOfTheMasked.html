<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clue of the Masked</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #050202; font-family: 'Press Start 2P', cursive; color: #e8d08c; overflow: hidden; }
        h1, h2, h3 { text-shadow: 3px 3px 0px #000; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #2a0808 0%, #050101 100%); z-index: 10; }
        .panel { background: rgba(15, 2, 2, 0.9); border: 4px solid #b38b22; padding: 40px; border-radius: 5px; box-shadow: inset 0 0 20px #000, 0 0 30px #000; text-align: center; }
        input { display: block; width: 100%; padding: 12px; margin: 15px 0; font-family: 'Press Start 2P', cursive; background: #000; color: #fff; border: 2px solid #b38b22; outline: none; font-size: 14px; }
        button { display: inline-block; padding: 15px 25px; margin: 10px 5px; font-family: 'Press Start 2P', cursive; background: #8c2222; color: #fff; border: 2px solid #e8d08c; cursor: pointer; font-size: 14px; text-transform: uppercase; transition: all 0.2s; box-shadow: 4px 4px 0 #000; }
        button:hover { background: #b32a2a; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; }
        button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
        #lobby ul { list-style: none; padding: 0; text-align: left; max-height: 250px; overflow-y: auto; margin-top: 20px; }
        #lobby li { background: #1a0505; margin: 8px 0; padding: 12px; border: 1px solid #b38b22; font-size: 12px; text-shadow: 1px 1px 0 #000; }
        #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #task-container { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); border: 2px solid #b38b22; padding: 15px; box-shadow: 4px 4px 0 #000; }
        #task-text { font-size: 16px; margin-bottom: 10px; }
        #progress-bar { display: none; width: 250px; height: 25px; background: #222; border: 2px solid #fff; margin-top: 5px; }
        #progress-fill { height: 100%; background: #2a8; width: 0%; transition: width 0.2s; }
        #room-name { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); border: 2px solid #b38b22; padding: 10px 18px; font-size: 12px; color: #e8d08c; text-shadow: 2px 2px 0 #000; box-shadow: 4px 4px 0 #000; }
        #controls-hint { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); border: 2px solid #555; padding: 15px; font-size: 10px; text-align: right; line-height: 2; box-shadow: 4px 4px 0 #000; }
        #sabotage-btn { display: none; pointer-events: auto; position: absolute; bottom: 150px; right: 20px; background: #800; color: white; border-color: #f00; }
        #minimap-wrap { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10,4,2,0.92); border: 4px solid #b38b22; padding: 12px; box-shadow: 6px 6px 0 #000; z-index: 8; }
        #minimap { display: block; width: min(85vw, 940px); image-rendering: pixelated; }
        #role-reveal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #role-reveal h1 { font-size: 50px; margin-bottom: 30px; animation: pulse 2s infinite; }
        #role-reveal p { font-size: 20px; color: #ccc; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #game-over { display: none; z-index: 30; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: crosshair; }
        #crosshair { display: none; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; box-shadow: 0 0 4px #000; }
        #lock-hint { display: none; position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(255,0,0,0.8); color: white; padding: 10px; font-size: 10px; border-radius: 5px; z-index: 10; animation: blink 1s infinite;}
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="crosshair"></div>
    <div id="lock-hint">CLICK PARA MOVER LA CÁMARA</div>

    <div id="main-menu" class="overlay">
        <div class="panel">
            <h1>Clue of the Masked</h1>
            <p style="font-size: 12px; margin-bottom: 30px; color: #b38b22;">Un misterio victoriano</p>
            <input type="text" id="input-name" placeholder="Tu Nombre" maxlength="10">
            <button id="btn-host">Crear Sala (Host)</button>
            <div style="margin: 25px 0; border-bottom: 2px dashed #b38b22;"></div>
            <input type="text" id="input-lobby" placeholder="ID de la Sala">
            <button id="btn-join">Unirse a Sala</button>
        </div>
    </div>

    <div id="lobby" class="overlay" style="display: none;">
        <div class="panel" style="min-width: 450px;">
            <h2 style="color: #fff; display: flex; justify-content: center; align-items: center; gap: 15px; margin: 0;">
                Sala: <span id="lobby-id-display" style="color: #e8d08c;"></span>
                <button id="btn-copy" style="padding: 8px 12px; font-size: 10px; background: #333; border: 2px solid #b38b22; margin: 0;">Copiar</button>
            </h2>
            <p style="font-size: 12px; color: #aaa; margin-top: 20px;">Esperando a los invitados...</p>
            <ul id="player-list"></ul>
            <button id="btn-start" style="display: none; background: #2a8; border-color: #5f5; width: 100%; margin-top: 20px;">Iniciar Partida</button>
        </div>
    </div>

    <div id="role-reveal"></div>

    <div id="hud">
        <div id="task-container">
            <div id="task-text">Tareas: 0 / 0</div>
            <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <div id="room-name">Pasillo</div>
        <button id="sabotage-btn">Apagón (Espacio)</button>
        <div id="controls-hint">
            <span style="color:#e8d08c">MOVER:</span> W A S D<br>
            <span style="color:#e8d08c">CÁMARA:</span> Mouse<br>
            <span style="color:#e8d08c">INTERACTUAR:</span> E<br>
            <span style="color:#e8d08c">PLANO:</span> M<br>
            <span id="action-btn" style="color:#f55; font-weight: bold;"></span>
        </div>
    </div>
    <div id="minimap-wrap"><canvas id="minimap" width="940" height="400"></canvas></div>

    <div id="game-over" class="overlay"></div>

    <script>
    // =====================================================================
    //  PLANO DE LA MANSIÓN (coordenadas medidas en píxeles sobre el plano)
    //  1 píxel del plano = 5 cm  ->  la casa mide ~45 m x 18.5 m
    // =====================================================================
    const S = 0.05;
    const WALL_H = 3.4, DOOR_H = 2.35, T_EXT = 0.32, T_INT = 0.2, TEX_W = 1.7;

    const ROOMS = [
        { id: 'pasillo',    name: 'Pasillo',              poly: [[293,252],[605,252],[605,318],[293,318]], lights: [[355,285],[450,285],[545,285]] },
        { id: 'sala',       name: 'Sala de estar',        poly: [[65,215],[110,215],[110,252],[293,252],[293,415],[102,415],[102,378],[65,378],[28,335],[28,255]], lights: [[120,300],[220,335]] },
        { id: 'invitados',  name: 'Dormitorio de invitados', poly: [[110,118],[293,118],[293,252],[110,252]], lights: [[201,185]] },
        { id: 'infantil',   name: 'Dormitorio infantil',  poly: [[293,118],[463,118],[463,252],[293,252]], lights: [[378,185]] },
        { id: 'bano2',      name: 'Baño 2',               poly: [[463,118],[553,118],[553,252],[463,252]], lights: [[508,185]] },
        { id: 'principal',  name: 'Dormitorio principal', poly: [[553,66],[815,66],[815,252],[553,252]], lights: [[690,159]] },
        { id: 'bano1',      name: 'Baño 1',               poly: [[815,66],[925,66],[925,170],[815,170]], lights: [[870,118]] },
        { id: 'vestidor',   name: 'Vestidor',             poly: [[815,170],[925,170],[925,252],[815,252]], lights: [[870,211]] },
        { id: 'cocina',     name: 'Cocina y comedor',     poly: [[605,252],[925,252],[925,405],[636,405],[636,318],[605,318]], lights: [[715,325],[850,325]] },
        { id: 'despensa',   name: 'Despensa',             poly: [[576,318],[636,318],[636,405],[576,405]], lights: [[606,361]] },
        { id: 'vestibulo',  name: 'Vestíbulo de entrada', poly: [[293,318],[413,318],[413,435],[293,435]], lights: [[353,376]] },
        { id: 'biblioteca', name: 'Biblioteca',           poly: [[413,318],[576,318],[576,435],[413,435]], lights: [[494,376]] }
    ];

    // Paredes: a->b, gaps = puertas (coordenada sobre el eje de la pared), splits = cambio de habitación
    const WALLS = [
        // ---- Exteriores ----
        { a: [110,118], b: [553,118], ext: 1, splits: [293,463] },
        { a: [553,66],  b: [553,118], ext: 1 },
        { a: [553,66],  b: [925,66],  ext: 1, splits: [815] },
        { a: [925,66],  b: [925,405], ext: 1, splits: [170,252] },
        { a: [925,405], b: [576,405], ext: 1, splits: [636] },
        { a: [576,405], b: [576,435], ext: 1 },
        { a: [576,435], b: [293,435], ext: 1, splits: [413] },
        { a: [293,435], b: [293,415], ext: 1 },
        { a: [293,415], b: [102,415], ext: 1 },
        { a: [102,415], b: [102,378], ext: 1 },
        { a: [102,378], b: [65,378],  ext: 1 },
        { a: [65,378],  b: [28,335],  ext: 1 },
        { a: [28,335],  b: [28,255],  ext: 1 },
        { a: [28,255],  b: [65,215],  ext: 1 },
        { a: [65,215],  b: [110,215], ext: 1 },
        { a: [110,118], b: [110,225], ext: 1, splits: [215] },
        // ---- Interiores ----
        { a: [293,118], b: [293,252] },
        { a: [463,118], b: [463,252] },
        { a: [553,118], b: [553,252] },
        { a: [140,252], b: [925,252], gaps: [[255,290],[300,335],[510,545],[563,597]], splits: [293,463,553,605,815] },
        { a: [293,252], b: [293,415], gaps: [[258,300]], splits: [318] },
        { a: [293,318], b: [636,318], gaps: [[338,392]], splits: [413,576,605] },
        { a: [413,318], b: [413,435], gaps: [[325,358]] },
        { a: [576,318], b: [576,405] },
        { a: [636,318], b: [636,405], gaps: [[345,377]] },
        { a: [605,252], b: [605,318], gaps: [[256,293]] },
        { a: [815,66],  b: [815,252], gaps: [[113,145],[195,222]], splits: [170] },
        { a: [815,170], b: [925,170] }
    ];

    const WINDOWS = [
        { a: [348,118], b: [402,118] },               // Dormitorio infantil
        { a: [485,118], b: [520,118] },               // Baño 2
        { a: [605,66],  b: [645,66] },                // Dormitorio principal
        { a: [690,66],  b: [730,66] },
        { a: [850,66],  b: [885,66] },                // Baño 1
        { a: [925,115], b: [925,155] },
        { a: [673,405], b: [725,405] },               // Cocina y comedor
        { a: [765,405], b: [810,405] },
        { a: [830,405], b: [872,405] },
        { a: [458,435], b: [515,435] },               // Biblioteca
        { a: [172,415], b: [228,415] },               // Sala de estar
        { a: [65,378],  b: [28,335], shrink: 0.18 },  // Bow-window de la sala
        { a: [28,322],  b: [28,268] },
        { a: [28,255],  b: [65,215], shrink: 0.18 },
        { a: [110,147], b: [110,200] }                // Dormitorio de invitados
    ];

    const SPAWNS = [315,345,375,405,435,465,495,525,555,585].map(x => ({ x: x * S, z: 285 * S }));
    const TASKS = [[150,330],[170,160],[420,160],[508,225],[760,110],[895,95],[895,235],[880,380],[606,392],[395,420],[545,420]]
        .map(([x, z]) => ({ x: x * S, z: z * S }));

    function pointInPoly(x, y, poly) {
        let ins = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
            if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
        }
        return ins;
    }
    function roomAt(xm, zm) {
        const px = xm / S, pz = zm / S;
        for (const r of ROOMS) if (pointInPoly(px, pz, r.poly)) return r;
        return null;
    }

    // =====================================================================
    //  PIXEL ART PROCEDURAL
    // =====================================================================
    function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function toRgb(c) {
        if (c[0] === '#') {
            if (c.length === 4) c = '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
            const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255];
        }
        const m = c.match(/[\d.]+/g).map(Number); return [m[0], m[1], m[2]];
    }
    function shade(c, f) {
        const k = v => Math.max(0, Math.min(255, Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f))));
        const [r, g, b] = toRgb(c); return 'rgb(' + k(r) + ',' + k(g) + ',' + k(b) + ')';
    }
    function makeTex(w, h, seed, draw) {
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
        const r = mulberry(seed);
        const P = {
            ctx, w, h, r,
            R: (x, y, ww, hh, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, ww, hh); },
            px: (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(((x % w) + w) % w, ((y % h) + h) % h, 1, 1); },
            grain: (x, y, ww, hh, base, amt, dens) => {
                for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++)
                    if (r() < dens) { ctx.fillStyle = shade(base, (r() * 2 - 1) * amt); ctx.fillRect(i, j, 1, 1); }
            }
        };
        draw(P);
        const t = new THREE.CanvasTexture(cv);
        t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        return t;
    }
    function stamp(P, m, ox, oy, col, hi, sh) {
        const H = m.length, W = m[0].length;
        const on = (i, j) => j >= 0 && j < H && i >= 0 && i < W && m[j][i] === 'X';
        for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
            if (on(i, j)) { P.px(ox + i, oy + j, (hi && !on(i, j - 1)) ? hi : col); }
            else if (sh && on(i - 1, j - 1)) P.px(ox + i, oy + j, sh);
        }
    }

    const DAMASK = ["......X......", ".....XXX.....", "....XX.XX....", "...XX.X.XX...", "..XX.XXX.XX..", ".XX.XX.XX.XX.", "XX.XX...XX.XX", "X.XX..X..XX.X", "XX.XX...XX.XX", ".XX.XX.XX.XX.", "..XX.XXX.XX..", "...XX.X.XX...", "....XX.XX....", ".....XXX.....", "......X......", "......X......", ".....X.X....."];
    const FLEUR = ["....X....", "...XXX...", "...XXX...", "X..XXX..X", "XX.XXX.XX", ".XXXXXXX.", "..XXXXX..", "XXXXXXXXX", "...XXX...", "..X.X.X..", ".X..X..X."];
    const STAR = ["..X..", ".XXX.", "XXXXX", ".XXX.", ".X.X."];

    // ---------- Empapelados ----------
    const paperDamask = (bg, fg, hi, motif = DAMASK, cw = 32, ch = 28) => (P, x0, y0, w, h) => {
        P.R(x0, y0, w, h, bg); P.grain(x0, y0, w, h, bg, 0.07, 0.45);
        const mw = motif[0].length, sh = shade(bg, -0.4);
        for (let c = 0; c * cw < w; c++) for (let k = -1; k * ch < h + ch; k++) {
            const ox = x0 + c * cw + Math.floor((cw - mw) / 2), oy = y0 + k * ch + (c % 2 ? Math.floor(ch / 2) : 0) + 8;
            stamp(P, motif, ox, oy, fg, hi, sh);
            const dx = x0 + c * cw, dy = y0 + k * ch + (c % 2 ? 0 : Math.floor(ch / 2)) + 14;
            P.px(dx, dy, hi); P.px(dx - 1, dy + 1, fg); P.px(dx + 1, dy + 1, fg); P.px(dx, dy + 2, fg);
        }
    };
    const paperStripes = (c1, c2, line, bud) => (P, x0, y0, w, h) => {
        for (let x = 0; x < w; x++) P.R(x0 + x, y0, 1, h, (x % 16) < 8 ? c1 : c2);
        P.grain(x0, y0, w, h, c2, 0.05, 0.3);
        for (let x = 0; x < w; x += 16) { P.R(x0 + x, y0, 1, h, line); P.R(x0 + x + 7, y0, 1, h, shade(line, 0.2)); }
        if (bud) for (let x = 12; x < w; x += 16) for (let y = 4; y < h; y += 14) {
            const yy = y0 + y + ((x >> 4) % 2 ? 7 : 0);
            P.px(x0 + x, yy, bud); P.px(x0 + x - 1, yy + 1, bud); P.px(x0 + x + 1, yy + 1, shade(bud, -0.3)); P.px(x0 + x, yy + 1, shade(bud, 0.35));
            P.px(x0 + x, yy + 2, '#4f6b45'); P.px(x0 + x - 1, yy + 3, '#4f6b45'); P.px(x0 + x + 1, yy + 3, '#3c5534');
        }
    };
    const paperKids = (bg, c1, c2) => (P, x0, y0, w, h) => {
        P.R(x0, y0, w, h, bg); P.grain(x0, y0, w, h, bg, 0.05, 0.35);
        for (let y = 2; y < h; y += 16) for (let x = 0; x < w; x += 16) {
            const c = (((x >> 4) + (y >> 4)) % 2) ? c1 : c2;
            stamp(P, STAR, x0 + x + ((y >> 4) % 2 ? 8 : 0) + 5, y0 + y, c, shade(c, 0.4), shade(bg, -0.2));
        }
        for (let y = 10; y < h; y += 16) for (let x = 0; x < w; x += 16) P.px(x0 + x + ((y >> 4) % 2 ? 0 : 8) + 1, y0 + y, shade(bg, -0.25));
    };
    const paperPlaster = (bg) => (P, x0, y0, w, h) => {
        P.R(x0, y0, w, h, bg); P.grain(x0, y0, w, h, bg, 0.06, 0.6);
        for (let i = 0; i < 14; i++) {
            const cx = Math.floor(P.r() * w), cy = y0 + Math.floor(P.r() * h);
            for (let j = 0; j < 6; j++) P.px(cx + Math.floor(P.r() * 5), cy + Math.floor(P.r() * 4), shade(bg, -0.07));
        }
    };
    const paperKitchen = (bg, blue) => (P, x0, y0, w, h) => {
        paperPlaster(bg)(P, x0, y0, w, h);
        const by = y0 + 12;
        P.R(x0, by - 1, w, 1, blue);
        for (let x = 0; x < w; x += 8) {
            P.R(x0 + x, by, 8, 8, '#9a968c'); P.R(x0 + x + 1, by + 1, 7, 7, '#f4f1ea');
            P.px(x0 + x + 4, by + 4, blue); P.px(x0 + x + 3, by + 4, blue); P.px(x0 + x + 5, by + 4, blue); P.px(x0 + x + 4, by + 3, blue); P.px(x0 + x + 4, by + 5, blue);
            P.px(x0 + x + 1, by + 1, blue); P.px(x0 + x + 7, by + 1, blue); P.px(x0 + x + 1, by + 7, blue); P.px(x0 + x + 7, by + 7, blue);
        }
        P.R(x0, by + 8, w, 1, blue);
    };
    const paperBrick = (bg) => (P, x0, y0, w, h) => {
        P.R(x0, y0, w, h, shade(bg, -0.22));
        for (let row = 0; row * 6 < h; row++) {
            const off = row % 2 ? 8 : 0;
            for (let x = -16; x < w; x += 16) {
                const c = shade(bg, (P.r() - 0.5) * 0.12);
                P.R(x0 + x + off, y0 + row * 6, 15, 5, c); P.R(x0 + x + off, y0 + row * 6, 15, 1, shade(c, 0.18));
            }
        }
        P.grain(x0, y0, w, h, bg, 0.08, 0.3);
    };
    const paperLattice = (bg, gold) => (P, x0, y0, w, h) => {
        P.R(x0, y0, w, h, bg); P.grain(x0, y0, w, h, bg, 0.07, 0.4);
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
            if (((x + y) % 16 === 0) || ((x - y + 256) % 16 === 0)) P.px(x0 + x, y0 + y, gold);
            else if (((x + y) % 16 === 1) || ((x - y + 256) % 16 === 1)) P.px(x0 + x, y0 + y, shade(bg, -0.35));
        }
        for (let y = 8; y < h; y += 16) for (let x = 0; x < w; x += 16) stamp(P, [".X.", "XXX", ".X."], x0 + x - 1, y0 + y - 1, gold, shade(gold, 0.4), null);
    };

    // ---------- Zócalos / boiseries ----------
    const WAINS = {

            for (let px = 0; px < w; px += 32) {
                const ix = x0 + px + 5, iy = y0 + 4, iw = 22, ih = h - 8;
                P.R(ix - 1, iy - 1, iw + 2, 1, shade(c, -0.45)); P.R(ix - 1, iy - 1, 1, ih + 2, shade(c, -0.45));
                P.R(ix - 1, iy + ih, iw + 2, 1, shade(c, 0.3)); P.R(ix + iw, iy - 1, 1, ih + 2, shade(c, 0.3));

        tile: (P, x0, y0, w, h, c) => {

    function makeWallTex(st, seed) {

            ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 64, railY); ctx.clip(); st.paper(P, 0, 0, 64, railY); ctx.restore();
            ctx.save(); ctx.beginPath(); ctx.rect(0, railY + 3, 64, 116 - railY); ctx.clip(); WAINS[st.wains](P, 0, railY + 3, 64, 116 - railY, st.wc); ctx.restore();
            const cr = st.crown;   // moldura de techo pintada
            P.R(0, 0, 64, 3, shade(cr, -0.2)); P.R(0, 3, 64, 2, cr); P.R(0, 5, 64, 1, shade(cr, 0.3));
            for (let x = 0; x < 64; x += 4) { P.R(x, 6, 2, 2, cr); P.R(x + 2, 6, 2, 2, shade(cr, -0.45)); }

    // ---------- Pisos (64px = 2 m) ----------
    function wrapRect(P, x, y, w, h, col) { for (const dx of [0, -64, 64]) for (const dy of [0, -64, 64]) P.R(x + dx, y + dy, w, h, col); }
    function floorHerring(base, seed) {
        return makeTex(64, 64, seed, P => {
            P.R(0, 0, 64, 64, shade(base, -0.55));

            const plank = (x, y, W, H) => { const c = shade(base, (P.r() - 0.5) * 0.28); wrapRect(P, x, y, W - 1, H - 1, c); wrapRect(P, x, y, W - 1, 1, shade(c, 0.22)); };

            }
            P.grain(0, 0, 64, 64, base, 0.1, 0.12);
        });
    }
    function floorBasket(base, seed) {

            P.R(0, 0, 64, 64, shade(base, -0.55));

                const hor = ((cx + cy) / 16) % 2 === 0;
                for (let k = 0; k < 4; k++) {
                    const c = shade(base, (P.r() - 0.5) * 0.25);
                    if (hor) { P.R(cx, cy + k * 4, 15, 3, c); P.R(cx, cy + k * 4, 15, 1, shade(c, 0.2)); }
                    else { P.R(cx + k * 4, cy, 3, 15, c); P.R(cx + k * 4, cy, 1, 15, shade(c, 0.2)); }

            P.grain(0, 0, 64, 64, base, 0.1, 0.12);
        });
    }
    function floorPlanks(base, seed) {
        return makeTex(64, 64, seed, P => {
            P.R(0, 0, 64, 64, shade(base, -0.55));

                for (const [a, b] of segs) {

                    for (let x = a + 1; x < b; x++) { P.px(x, y, shade(c, 0.16)); for (let k = 1; k < 7; k++) P.px(x, y + k, c); }
                    for (let g = 0; g < 3; g++) {

    function floorChecker(c1, c2) {

            for (let y = 0; y < 64; y += 16) for (let x = 0; x < 64; x += 16) {

    function floorOctagon() {

    function floorDiamond(c1, c2) {

                P.px(x, y, edge ? '#8a867e' : ((a + b) % 2 ? c2 : c1));

    function floorEncaustic() {

        return { root, bodyGroup, armL, armR, legL, legR };
    };

    // =====================================================================
    //  MOTOR 3D (PRIMERA PERSONA)
    // =====================================================================
    class Engine3D {
        constructor(containerId) {
            this.container = document.getElementById(containerId);
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color('#000000');
            this.scene.fog = new THREE.Fog(0x000000, 0.1, 1000); // pre-compilada (no recrear nunca)

            this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 200);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.container.appendChild(this.renderer.domElement);

            this.flashlight = new THREE.PointLight(0xffaa55, 0, 3, 1.5);
            this.camera.add(this.flashlight);
            this.scene.add(this.camera);

            this.ambientLight = new THREE.AmbientLight(0xfff0dd, 0.3); this.scene.add(this.ambientLight);
            this.hemiLight = new THREE.HemisphereLight(0xffe6c0, 0x2a1a10, 0.25); this.scene.add(this.hemiLight);

            this.players = {}; this.localPlayerId = null;
            this.segs = []; this.roomLights = []; this.taskMarkers = []; this.mapBuilt = false;
            this.bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe7a0 });
            this.clock = new THREE.Clock();
            this.keys = {};
            this.yaw = 0; this.pitch = 0;
            this.isBlackout = null; this.blackoutKiller = null;

            window.addEventListener('keydown', (e) => this.keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => this.keys[e.key.toLowerCase()] = false);
            window.addEventListener('resize', () => { this.camera.aspect = window.innerWidth / window.innerHeight; this.camera.updateProjectionMatrix(); this.renderer.setSize(window.innerWidth, window.innerHeight); }, false);
            this.container.addEventListener('click', () => { if (gameState.status === 'playing' && document.body.requestPointerLock) document.body.requestPointerLock(); });
            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) document.getElementById('lock-hint').style.display = 'none';
                else if (gameState.status === 'playing') document.getElementById('lock-hint').style.display = 'block';
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    this.yaw -= e.movementX * 0.002;
                    this.pitch -= e.movementY * 0.002;
                    this.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, this.pitch));
                }
            });

            this.lastNetUpdate = 0; this.lastHostUpdate = 0;
            this.animate = this.animate.bind(this);
            requestAnimationFrame(this.animate);
        }

        // ---------------- Construcción de la casa ----------------
        buildMap() {
            if (this.mapBuilt) return;
            this.mapBuilt = true;
            const sc = this.scene;
            const ceilT = ceilTex(); ceilT.repeat.set(0.5, 0.5);

            this.mats = {};
            let seed = 100;
            for (const id in STYLES) {
                const st = STYLES[id];
                const ft = st.floor(); ft.repeat.set(0.5, 0.5);
                this.mats[id] = {
                    wall: new THREE.MeshLambertMaterial({ map: makeWallTex(st.wall, seed++) }),
                    floor: new THREE.MeshLambertMaterial({ map: ft, side: THREE.DoubleSide }),
                    ceil: new THREE.MeshLambertMaterial({ map: ceilT, color: new THREE.Color(st.wall.crown), side: THREE.DoubleSide }),
                    base: new THREE.MeshLambertMaterial({ color: new THREE.Color(st.wall.base) }),
                    rail: new THREE.MeshLambertMaterial({ color: new THREE.Color(st.wall.rail) }),
                    crown: new THREE.MeshLambertMaterial({ color: new THREE.Color(st.wall.crown) })
                };
            }
            this.extMat = new THREE.MeshLambertMaterial({ color: 0x2e2a26 });
            this.jambMat = new THREE.MeshLambertMaterial({ color: 0x3a2212 });
            this.woodDark = new THREE.MeshLambertMaterial({ color: 0x2e1a0e });
            this.stoneMat = new THREE.MeshLambertMaterial({ color: 0xcfc8ba });
            this.glassMat = new THREE.MeshBasicMaterial({ map: windowTex() });
            this.brassMat = new THREE.MeshLambertMaterial({ color: 0xb08a3a, emissive: 0x2a1c05 });

            // Pisos y techos (polígonos exactos de cada habitación)
            for (const room of ROOMS) {
                const m = this.mats[room.id];
                const fg = new THREE.ShapeGeometry(new THREE.Shape(room.poly.map(([x, z]) => new THREE.Vector2(x * S, -z * S))));
                fg.rotateX(-Math.PI / 2);
                sc.add(new THREE.Mesh(fg, m.floor));
                const cg = new THREE.ShapeGeometry(new THREE.Shape(room.poly.map(([x, z]) => new THREE.Vector2(x * S, z * S))));
                cg.rotateX(Math.PI / 2);
                const ceil = new THREE.Mesh(cg, m.ceil); ceil.position.y = WALL_H; sc.add(ceil);

                // Iluminación de la habitación (araña de techo)
                const xs = room.poly.map(p => p[0]), zs = room.poly.map(p => p[1]);
                const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs)) * S;
                const dist = span / room.lights.length * 0.8 + 3.5;
                for (const [lx, lz] of room.lights) {
                    const L = new THREE.PointLight(0xffd59a, 1.1, dist, 1.4);
                    L.position.set(lx * S, WALL_H - 0.9, lz * S);
                    sc.add(L); this.roomLights.push(L);
                    this.addChandelier(lx * S, lz * S);
                }
            }

            for (const w of WALLS) this.buildWallLine(w);
            for (const wd of WINDOWS) this.addWindow(wd);
            this.addFireplace();
            this.addFrontDoor();

            // Marcadores de tareas (destellos dorados, sin muebles)
            const tg = new THREE.OctahedronGeometry(0.16);
            const tm = new THREE.MeshBasicMaterial({ color: 0xffd34d });
            for (const t of TASKS) {
                const mk = new THREE.Mesh(tg, tm); mk.position.set(t.x, 1.1, t.z);
                sc.add(mk); this.taskMarkers.push(mk);
            }
        }

        buildWallLine(w) {
            const T = w.ext ? T_EXT : T_INT;
            const [ax, az] = w.a, [bx, bz] = w.b;
            const horiz = az === bz;
            const Lpx = Math.hypot(bx - ax, bz - az);
            const toT = v => horiz ? (v - ax) / (bx - ax) : (v - az) / (bz - az);
            const gaps = (w.gaps || []).map(([s, e]) => { const t1 = toT(s), t2 = toT(e); return t1 < t2 ? [t1, t2] : [t2, t1]; });
            let marks = [0, 1];
            (w.splits || []).forEach(s => marks.push(toT(s)));
            gaps.forEach(g => marks.push(g[0], g[1]));
            marks = [...new Set(marks.map(v => +v.toFixed(6)))].filter(v => v >= 0 && v <= 1).sort((a, b) => a - b);

            for (let i = 0; i < marks.length - 1; i++) {
                const t0 = marks[i], t1 = marks[i + 1];
                if (t1 - t0 < 1e-6) continue;
                const mid = (t0 + t1) / 2;
                const isGap = gaps.some(g => mid > g[0] && mid < g[1]);
                const p0 = [ax + (bx - ax) * t0, az + (bz - az) * t0], p1 = [ax + (bx - ax) * t1, az + (bz - az) * t1];
                const uStart = t0 * Lpx * S;
                if (isGap) {
                    this.wallPiece(p0, p1, T, DOOR_H, WALL_H, uStart, 0, 0, true);
                    this.doorCasing(p0, p1, T);
                } else {
                    this.wallPiece(p0, p1, T, 0, WALL_H, uStart, t0 === 0 ? T / 2 : 0, t1 === 1 ? T / 2 : 0, false);
                    this.segs.push({ ax: p0[0] * S, az: p0[1] * S, bx: p1[0] * S, bz: p1[1] * S, r: T / 2 });
                }
            }
        }

        frame(p0, p1) {
            const ax = p0[0] * S, az = p0[1] * S, bx = p1[0] * S, bz = p1[1] * S;
            const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
            const ux = dx / L, uz = dz / L;
            return { ax, az, bx, bz, L, ux, uz, nx: -uz, nz: ux, mx: (ax + bx) / 2, mz: (az + bz) / 2, rot: Math.atan2(-uz, ux) };
        }

        wallPiece(p0, p1, T, y0, y1, uStart, extA, extB, isLintel) {
            const f = this.frame(p0, p1);
            const len = f.L + extA + extB, h = y1 - y0;
            const shift = (extB - extA) / 2;
            const g = new THREE.BoxGeometry(len, h, T);
            const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
            for (let i = 0; i < pos.count; i++) {
                const lx = pos.getX(i), ly = pos.getY(i), lz = pos.getZ(i);
                const nX = nor.getX(i), nZ = nor.getZ(i);
                const wy = y0 + ly + h / 2;
                let u, v;
                if (Math.abs(nZ) > 0.5) { u = (uStart - extA + lx + len / 2) / TEX_W; if (nZ < 0) u = -u; v = wy / WALL_H; }
                else if (Math.abs(nX) > 0.5) { u = lz / TEX_W; v = wy / WALL_H; }
                else { u = lx / TEX_W; v = lz / TEX_W; }
                uv.setXY(i, u, v);
            }
            const off = T / 2 + 0.2;
            const rp = roomAt(f.mx + f.nx * off, f.mz + f.nz * off), rn = roomAt(f.mx - f.nx * off, f.mz - f.nz * off);
            const mP = rp ? this.mats[rp.id].wall : this.extMat, mN = rn ? this.mats[rn.id].wall : this.extMat;
            const mesh = new THREE.Mesh(g, [this.jambMat, this.jambMat, this.jambMat, this.jambMat, mP, mN]);
            mesh.position.set(f.mx + f.ux * shift, y0 + h / 2, f.mz + f.uz * shift);
            mesh.rotation.y = f.rot;
            this.scene.add(mesh);

            // Molduras 3D: zócalo, moldura de silla y cornisa (relieve real)
            for (const [side, room] of [[1, rp], [-1, rn]]) {
                if (!room) continue;
                const m = this.mats[room.id], st = STYLES[room.id].wall;
                const strip = (y, hh, d, mat) => {
                    const s = new THREE.Mesh(new THREE.BoxGeometry(f.L, hh, d), mat);
                    const o = side * (T / 2 + d / 2);
                    s.position.set(f.mx + f.nx * o, y, f.mz + f.nz * o); s.rotation.y = f.rot;
                    this.scene.add(s);
                };
                if (!isLintel) {
                    strip(0.1, 0.2, 0.05, m.base);
                    strip(0.215, 0.03, 0.065, m.base);
                    strip(st.railM, 0.06, 0.035, m.rail);
                }
                strip(WALL_H - 0.09, 0.18, 0.1, m.crown);
                strip(WALL_H - 0.22, 0.06, 0.05, m.crown);
            }
        }

        doorCasing(p0, p1, T) {
            const f = this.frame(p0, p1);
            const off = T / 2 + 0.2;
            for (const side of [1, -1]) {
                const room = roomAt(f.mx + f.nx * off * side, f.mz + f.nz * off * side);
                if (!room) continue;
                const mat = this.jambMat;
                const d = T / 2 + 0.04;
                const put = (geo, along, y) => {
                    const m = new THREE.Mesh(geo, mat);
                    m.position.set(f.mx + f.ux * along + f.nx * d * side, y, f.mz + f.uz * along + f.nz * d * side);
                    m.rotation.y = f.rot; this.scene.add(m);
                };
                const postG = new THREE.BoxGeometry(0.14, DOOR_H + 0.14, 0.08);
                put(postG, -(f.L / 2 + 0.07), (DOOR_H + 0.14) / 2);
                put(postG, (f.L / 2 + 0.07), (DOOR_H + 0.14) / 2);
                put(new THREE.BoxGeometry(f.L + 0.36, 0.06, 0.12), 0, DOOR_H + 0.17);
                put(new THREE.BoxGeometry(0.2, 0.26, 0.1), -(f.L / 2 + 0.07), 0.13);
                put(new THREE.BoxGeometry(0.2, 0.26, 0.1), (f.L / 2 + 0.07), 0.13);
            }
        }

        addWindow(wd) {
            let a = wd.a, b = wd.b;
            if (wd.shrink) {
                const k = wd.shrink;
                a = [wd.a[0] + (wd.b[0] - wd.a[0]) * k, wd.a[1] + (wd.b[1] - wd.a[1]) * k];
                b = [wd.b[0] + (wd.a[0] - wd.b[0]) * k, wd.b[1] + (wd.a[1] - wd.b[1]) * k];
            }
            const f = this.frame(a, b);
            const off = T_EXT / 2 + 0.2;
            let side = 1, room = roomAt(f.mx + f.nx * off, f.mz + f.nz * off);
            if (!room) { side = -1; room = roomAt(f.mx - f.nx * off, f.mz - f.nz * off); }
            if (!room) return;
            const y0 = Math.max(0.85, STYLES[room.id].wall.railM + 0.12), y1 = 2.8, H = y1 - y0, W = f.L;
            const rot = f.rot + (side < 0 ? Math.PI : 0);
            const put = (obj, along, y, depth) => {
                obj.position.set(f.mx + f.ux * along + f.nx * side * depth, y, f.mz + f.uz * along + f.nz * side * depth);
                obj.rotation.y = rot; this.scene.add(obj);
            };
            const base = T_EXT / 2;
            put(new THREE.Mesh(new THREE.PlaneGeometry(W - 0.08, H - 0.08), this.glassMat), 0, (y0 + y1) / 2, base + 0.01);
            put(new THREE.Mesh(new THREE.BoxGeometry(0.12, H, 0.09), this.jambMat), -W / 2, (y0 + y1) / 2, base + 0.045);
            put(new THREE.Mesh(new THREE.BoxGeometry(0.12, H, 0.09), this.jambMat), W / 2, (y0 + y1) / 2, base + 0.045);
            put(new THREE.Mesh(new THREE.BoxGeometry(W + 0.24, 0.14, 0.09), this.jambMat), 0, y1 + 0.07, base + 0.045);
            put(new THREE.Mesh(new THREE.BoxGeometry(W + 0.4, 0.08, 0.15), this.jambMat), 0, y1 + 0.18, base + 0.075);
            put(new THREE.Mesh(new THREE.BoxGeometry(W + 0.32, 0.07, 0.2), this.stoneMat), 0, y0 - 0.035, base + 0.1);
            put(new THREE.Mesh(new THREE.BoxGeometry(W, 0.14, 0.05), this.jambMat), 0, y0 - 0.14, base + 0.025);
        }

        addChandelier(x, z) {
            const sc = this.scene;
            const rose = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.42, 0.05, 16), this.stoneMat); rose.position.set(x, WALL_H - 0.025, z); sc.add(rose);

        // ---------------- Jugadores ----------------
        addPlayer(id, x, z, gender, maskIndex, isLocal = false) {
            const model = create3DCharacter(gender, maskIndex);
            const root = model.root;
            root.position.set(x, 0, z);
            if (isLocal) {
                root.visible = false;
                this.players[id] = { mesh: root, isLocal: true, isMoving: false };
                this.localPlayerId = id;
            } else {
                root.visible = true;
                this.players[id] = { mesh: root, model: model, isLocal: false, targetYaw: 0, isMoving: false, animTime: 0 };
            }
            this.scene.add(root);
        }
        removePlayer(id) { if (this.players[id]) { this.scene.remove(this.players[id].mesh); delete this.players[id]; } }

        setBlackout(isBlackout, isKiller) {
            if (this.isBlackout === isBlackout && this.blackoutKiller === isKiller) return;
            this.isBlackout = isBlackout; this.blackoutKiller = isKiller;
            this.ambientLight.intensity = isBlackout ? 0.03 : 0.3;
            this.hemiLight.intensity = isBlackout ? 0 : 0.25;
            for (const L of this.roomLights) L.intensity = isBlackout ? 0 : 1.1;
            this.bulbMat.color.set(isBlackout ? 0x221d14 : 0xffe7a0);
            this.scene.fog.far = isBlackout ? (isKiller ? 12 : 3) : 1000;
            this.flashlight.intensity = isBlackout ? 0.9 : 0;
            this.flashlight.distance = isKiller ? 12 : 3.5;
        }

        resolveCollisions(p) {
            const R = 0.28;
            for (let it = 0; it < 3; it++) {
                for (const s of this.segs) {
                    const vx = s.bx - s.ax, vz = s.bz - s.az, l2 = vx * vx + vz * vz;
                    let t = l2 ? ((p.x - s.ax) * vx + (p.z - s.az) * vz) / l2 : 0;
                    t = Math.max(0, Math.min(1, t));
                    const dx = p.x - (s.ax + vx * t), dz = p.z - (s.az + vz * t);
                    const d = Math.hypot(dx, dz), min = R + s.r;
                    if (d < min && d > 1e-6) { const k = (min - d) / d; p.x += dx * k; p.z += dz * k; }
                }
            }
        }

        animate() {
            requestAnimationFrame(this.animate);
            const dt = Math.min(this.clock.getDelta(), 0.05);
            const now = performance.now();

            if (this.localPlayerId && this.players[this.localPlayerId]) {
                const player = this.players[this.localPlayerId], speed = 4.5, dir = new THREE.Vector3();
                if (this.keys.w || this.keys.arrowup) dir.z -= 1;
                if (this.keys.s || this.keys.arrowdown) dir.z += 1;
                if (this.keys.a || this.keys.arrowleft) dir.x -= 1;
                if (this.keys.d || this.keys.arrowright) dir.x += 1;
                const dead = gameState.players[this.localPlayerId] && gameState.players[this.localPlayerId].isDead;
                if (dir.lengthSq() > 0 && !dead) {
                    dir.normalize(); dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);
                    player.isMoving = true;
                    player.mesh.position.x += dir.x * speed * dt;
                    player.mesh.position.z += dir.z * speed * dt;
                    this.resolveCollisions(player.mesh.position);
                } else { player.isMoving = false; }
                this.camera.position.set(player.mesh.position.x, 1.7, player.mesh.position.z);
                this.camera.rotation.set(this.pitch, this.yaw, 0, 'YXZ');

                const r = roomAt(player.mesh.position.x, player.mesh.position.z);
                const label = r ? r.name : '';
                if (ui.roomName.textContent !== label) ui.roomName.textContent = label;
                if (ui.minimapWrap.style.display === 'block') drawMinimap();
            }

            for (const mk of this.taskMarkers) { mk.rotation.y += dt * 2; mk.position.y = 1.1 + Math.sin(now / 400) * 0.06; }

            for (let id in this.players) {
                const p = this.players[id];
                if (p.isLocal) continue;
                if (p.targetPos) p.mesh.position.lerp(p.targetPos, 0.4);
                const qTarget = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, p.targetYaw, 0));
                if (!p.dead) p.mesh.quaternion.slerp(qTarget, 0.3);
                if (p.isMoving) {
                    p.animTime += dt * 10; const swing = Math.sin(p.animTime);
                    p.model.legL.rotation.x = swing * 0.6; p.model.legR.rotation.x = -swing * 0.6;
                    p.model.armL.rotation.x = -swing * 0.6; p.model.armR.rotation.x = swing * 0.6;
                    p.model.bodyGroup.position.y = Math.abs(swing) * 0.08;
                } else {
                    p.animTime = 0;
                    p.model.legL.rotation.x = 0; p.model.legR.rotation.x = 0;
                    p.model.armL.rotation.x = 0; p.model.armR.rotation.x = 0;
                    p.model.bodyGroup.position.y = 0;
                }
            }
            this.renderer.render(this.scene, this.camera);

            if (gameState.status === 'playing') {
                if (this.localPlayerId && !(gameState.players[this.localPlayerId] && gameState.players[this.localPlayerId].isDead)) {
                    if (now - this.lastNetUpdate > 25) {
                        const localP = this.players[this.localPlayerId];
                        network.sendToHost({ type: 'move', id: this.localPlayerId, x: localP.mesh.position.x, z: localP.mesh.position.z, yaw: this.yaw, moving: localP.isMoving });
                        this.lastNetUpdate = now;
                    }
                }
                if (network.isHost && now - this.lastHostUpdate > 50) {
                    network.broadcast({ type: 'state', state: gameState });
                    updateGameClient();
                    this.lastHostUpdate = now;
                }
            }
        }
    }

    // =====================================================================
    //  RED (PeerJS)
    // =====================================================================
    class NetworkManager {
        constructor() { this.peer = null; this.connections = {}; this.isHost = false; }
        init(isHost, lobbyId = null, username = "Player") {
            this.isHost = isHost; this.username = username;
            return new Promise((resolve, reject) => {
                this.peer = new Peer(isHost ? 'CLUE-' + Math.random().toString(36).substring(2, 8).toUpperCase() : null);
                this.peer.on('open', (id) => {
                    this.myId = id;
                    if (isHost) { this.setupHostListeners(); resolve(id); }
                    else { this.joinLobby(lobbyId).then(() => resolve(id)).catch(reject); }
                });
                this.peer.on('error', reject);
            });
        }
        setupHostListeners() {
            this.peer.on('connection', (conn) => {
                conn.on('open', () => {
                    this.connections[conn.peer] = conn;
                    conn.on('data', (data) => { if (this.onGameStateUpdate) this.onGameStateUpdate(conn.peer, data); });
                    conn.on('close', () => { delete this.connections[conn.peer]; if (this.onPlayerLeft) this.onPlayerLeft(conn.peer); });
                });
            });
        }
        joinLobby(lobbyId) {
            return new Promise((resolve, reject) => {
                const conn = this.peer.connect(lobbyId);
                conn.on('open', () => {
                    this.hostConn = conn;
                    this.sendToHost({ type: 'join', name: this.username });
                    conn.on('data', (data) => { if (this.onGameStateUpdate) this.onGameStateUpdate('host', data); });
                    resolve();
                });
                conn.on('error', reject);
            });
        }
        broadcast(data) { if (this.isHost) for (let id in this.connections) this.connections[id].send(data); }
        sendToHost(data) { if (this.isHost && this.onGameStateUpdate) this.onGameStateUpdate(this.myId, data); else if (this.hostConn) this.hostConn.send(data); }
    }

    const ui = {
        menu: document.getElementById('main-menu'), lobby: document.getElementById('lobby'), hud: document.getElementById('hud'), roleReveal: document.getElementById('role-reveal'), gameOver: document.getElementById('game-over'),

        roomName: document.getElementById('room-name'), minimapWrap: document.getElementById('minimap-wrap'), minimap: document.getElementById('minimap')

    let engine, network, myId = null, myRole = 'guest', currentLobbyId = null;

    function drawMinimap() {
        const ctx = ui.minimap.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#0d0604'; ctx.fillRect(0, 0, 940, 400);
        ctx.setTransform(1, 0, 0, 1, -8, -50);
        for (const r of ROOMS) {
            ctx.beginPath(); r.poly.forEach(([x, z], i) => i ? ctx.lineTo(x, z) : ctx.moveTo(x, z)); ctx.closePath();
            ctx.fillStyle = '#2a1810'; ctx.fill();
        }
        ctx.strokeStyle = '#e8d08c'; ctx.lineCap = 'square';
        for (const s of engine.segs) { ctx.lineWidth = Math.max(2, s.r * 2 / S); ctx.beginPath(); ctx.moveTo(s.ax / S, s.az / S); ctx.lineTo(s.bx / S, s.bz / S); ctx.stroke(); }
        ctx.fillStyle = '#b38b22'; ctx.font = '8px "Press Start 2P"'; ctx.textAlign = 'center';
        for (const r of ROOMS) {
            const xs = r.poly.map(p => p[0]), zs = r.poly.map(p => p[1]);
            const cx = r.id === 'cocina' ? 780 : r.id === 'sala' ? 170 : (Math.min(...xs) + Math.max(...xs)) / 2;
            const cz = r.id === 'cocina' ? 345 : (Math.min(...zs) + Math.max(...zs)) / 2;
            ctx.fillText(r.name, cx, cz);
        }
        const lp = engine.players[engine.localPlayerId];
        if (lp) {
            const px = lp.mesh.position.x / S, pz = lp.mesh.position.z / S;
            ctx.fillStyle = '#ff4040'; ctx.beginPath(); ctx.arc(px, pz, 6, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ff4040'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, pz); ctx.lineTo(px - Math.sin(engine.yaw) * 16, pz - Math.cos(engine.yaw) * 16); ctx.stroke();
        }
    }

    ui.btnHost.onclick = async () => {
        if (!ui.inputName.value) return alert("Ingresa un nombre");
        myId = await network.init(true, null, ui.inputName.value);
        currentLobbyId = myId;
        ui.menu.style.display = 'none'; ui.lobby.style.display = 'flex'; ui.lobbyIdDisplay.innerText = currentLobbyId; ui.btnStart.style.display = 'block';
        addPlayerToState(myId, ui.inputName.value);
    };
    ui.btnJoin.onclick = async () => {
        if (!ui.inputName.value || !ui.inputLobby.value) return alert("Datos requeridos");
        myId = await network.init(false, ui.inputLobby.value.trim(), ui.inputName.value);
        currentLobbyId = ui.inputLobby.value.trim();
        ui.menu.style.display = 'none'; ui.lobby.style.display = 'flex'; ui.lobbyIdDisplay.innerText = currentLobbyId;
    };
    ui.btnCopy.onclick = () => { navigator.clipboard.writeText(currentLobbyId).then(() => { ui.btnCopy.innerText = '¡Copiado!'; setTimeout(() => ui.btnCopy.innerText = 'Copiar', 2000); }); };
    ui.btnStart.onclick = () => { if (network.isHost) startGame(); };

    network.onGameStateUpdate = (sender, data) => {
        if (data.type === 'join' && network.isHost) { addPlayerToState(sender, data.name); network.broadcast({ type: 'state', state: gameState }); }
        else if (data.type === 'state') {
            const oldStatus = gameState.status; gameState = data.state;
            if (oldStatus === 'lobby' && gameState.status === 'playing') setupGameClient();
            else if (gameState.status === 'playing' && !network.isHost) updateGameClient();
            else if (gameState.status === 'finished') showGameOver(gameState.winner);
            if (gameState.status === 'lobby') updateLobbyUI();
        }
        else if (data.type === 'move' && network.isHost) {
            const p = gameState.players[data.id];
            if (p) { p.x = data.x; p.z = data.z; p.yaw = data.yaw; p.moving = data.moving; }
        }
        else if (data.type === 'action' && network.isHost) {
            if (gameState.players[sender] && !gameState.players[sender].isDead) { gameState.tasksCompleted++; if (gameState.tasksCompleted >= gameState.tasksTotal) endGame('guests'); }
        }
        else if (data.type === 'kill' && network.isHost) {
            const t = gameState.players[data.target];
            if (gameState.blackout && t && !t.isDead) { t.isDead = true; checkWinCondition(); }
        }
        else if (data.type === 'sabotage' && network.isHost) {
            if (gameState.blackout) return;
            gameState.blackout = true;
            setTimeout(() => { if (gameState.status === 'playing') { gameState.blackout = false; network.broadcast({ type: 'state', state: gameState }); updateGameClient(); } }, 15000);
        }
    };
    network.onPlayerLeft = (id) => { if (network.isHost && gameState.players[id]) { delete gameState.players[id]; network.broadcast({ type: 'state', state: gameState }); updateLobbyUI(); engine.removePlayer(id); } };

    let sabotageReady = true;
    window.addEventListener('keydown', (e) => {
        if (gameState.status !== 'playing') return;
        if (e.key === 'm' || e.key === 'M') { ui.minimapWrap.style.display = ui.minimapWrap.style.display === 'block' ? 'none' : 'block'; return; }
        if (gameState.players[myId] && gameState.players[myId].isDead) return;
        if (e.key === 'e' || e.key === 'E') doAction();
        if ((e.key === 'q' || e.key === 'Q') && myRole === 'killer') attemptKill();
        if (e.key === ' ' && myRole === 'killer' && sabotageReady) {
            sabotageReady = false;
            network.sendToHost({ type: 'sabotage' });
            ui.sabotageBtn.style.opacity = 0.5;
            setTimeout(() => { sabotageReady = true; ui.sabotageBtn.style.opacity = 1; }, 60000);
        }
    });

    function addPlayerToState(id, name) {
        const count = Object.keys(gameState.players).length;
        gameState.players[id] = { name, gender: count % 2 === 0 ? 'male' : 'female', maskIndex: count, isDead: false, x: 0, z: 0, yaw: 0, moving: false, role: 'guest' };
        updateLobbyUI();
    }
    function updateLobbyUI() {
        ui.playerList.innerHTML = '';
        for (let id in gameState.players) {
            const p = gameState.players[id]; const li = document.createElement('li');
            li.innerText = p.name + ' (' + (p.gender === 'male' ? 'Traje' : 'Vestido') + ') - Máscara ' + maskData[p.maskIndex % maskData.length].name;
            ui.playerList.appendChild(li);
        }
    }

    function startGame() {
        gameState.status = 'playing';
        gameState.tasksTotal = TASKS.length * 2; gameState.tasksCompleted = 0; gameState.blackout = false;
        const pIds = Object.keys(gameState.players);
        const killerId = pIds[Math.floor(Math.random() * pIds.length)];
        pIds.forEach((id, i) => {
            const p = gameState.players[id];
            p.role = (id === killerId) ? 'killer' : 'guest';
            const sp = SPAWNS[i % SPAWNS.length]; p.x = sp.x; p.z = sp.z; p.yaw = 0;
        });
        network.broadcast({ type: 'state', state: gameState });
        setupGameClient();
    }

    function setupGameClient() {
        ui.lobby.style.display = 'none'; ui.hud.style.display = 'block';
        engine.buildMap();
        document.getElementById('crosshair').style.display = 'block'; document.getElementById('lock-hint').style.display = 'block';
        myRole = gameState.players[myId].role;
        ui.roleReveal.style.display = 'flex';
        ui.roleReveal.innerHTML = '<h1>Eres un ' + (myRole === 'killer' ? '<span style="color:#f55">ASESINO</span>' : '<span style="color:#5f5">INVITADO</span>') + '</h1><p>' + (myRole === 'killer' ? 'Elimínalos a todos en la oscuridad.' : 'Completa las tareas de la mansión.') + '</p>';
        setTimeout(() => ui.roleReveal.style.display = 'none', 4000);
        if (myRole === 'killer') { ui.sabotageBtn.style.display = 'block'; ui.actionBtn.innerText = 'Matar (Q)'; }
        for (let id in gameState.players) { const p = gameState.players[id]; engine.addPlayer(id, p.x, p.z, p.gender, p.maskIndex, id === myId); }
        engine.setBlackout(false, myRole === 'killer');
    }

    function updateGameClient() {
        ui.taskText.innerText = 'Progreso: ' + gameState.tasksCompleted + ' / ' + gameState.tasksTotal;
        engine.setBlackout(gameState.blackout, myRole === 'killer');
        for (let id in gameState.players) {
            const pState = gameState.players[id];
            const pObj = engine.players[id];
            if (!pObj) continue;
            if (pState.isDead) {
                pObj.dead = true; pObj.isMoving = false;
                if (!pObj.isLocal) { pObj.mesh.rotation.set(0, pObj.mesh.rotation.y, Math.PI / 2); pObj.mesh.position.y = 0.2; }
            } else if (!pObj.isLocal) {
                pObj.targetPos = new THREE.Vector3(pState.x, 0, pState.z);
                pObj.targetYaw = pState.yaw || 0;
                pObj.isMoving = pState.moving;
            }
        }
        if (gameState.players[myId] && gameState.players[myId].isDead) { ui.taskText.innerText = "ESTÁS MUERTO"; ui.taskText.style.color = "red"; }
    }

    let isDoingTask = false;
    function doAction() {
        if (myRole === 'killer' || isDoingTask) return;
        const p = engine.camera.position;
        const near = TASKS.some(t => Math.hypot(t.x - p.x, t.z - p.z) < 1.6);
        if (!near) return;
        isDoingTask = true; ui.progressBar.style.display = 'block'; ui.progressBar.firstElementChild.style.width = '0%';
        let prog = 0;
        const int = setInterval(() => {
            prog += 10; ui.progressBar.firstElementChild.style.width = prog + '%';
            if (prog >= 100) { clearInterval(int); isDoingTask = false; ui.progressBar.style.display = 'none'; network.sendToHost({ type: 'action' }); }
        }, 300);
    }
    function attemptKill() {
        if (!gameState.blackout) return;
        const p = engine.camera.position;
        for (let id in gameState.players) {
            const t = gameState.players[id];
            if (id !== myId && !t.isDead && Math.hypot(t.x - p.x, t.z - p.z) < 2) { network.sendToHost({ type: 'kill', target: id }); break; }
        }
    }
    function checkWinCondition() {
        let aliveGuests = 0;
        for (let id in gameState.players) if (gameState.players[id].role === 'guest' && !gameState.players[id].isDead) aliveGuests++;
        if (aliveGuests === 0) endGame('killer');
    }
    function endGame(winner) { gameState.status = 'finished'; gameState.winner = winner; network.broadcast({ type: 'state', state: gameState }); showGameOver(winner); }
    function showGameOver(winner) {
        if (document.exitPointerLock) document.exitPointerLock();
        ui.hud.style.display = 'none'; ui.minimapWrap.style.display = 'none'; document.getElementById('crosshair').style.display = 'none';
        ui.gameOver.style.display = 'flex';
        ui.gameOver.innerHTML = '<h1>' + (winner === 'killer' ? '¡EL ASESINO HA GANADO!' : '¡LOS INVITADOS SOBREVIVIERON!') + '</h1><button onclick="location.reload()">Jugar de Nuevo</button>';
    }
    </script>
</body>
</html>
